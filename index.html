<head>
    <meta charset="UTF-8">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        
    >

    <link 
    rel="stylesheet" 
    href="css/style.css"
    />

</head>

<body>

<div id="app">

    <aside id="sidebar">

        <div class="sidebar-header">

            <h2>🌍 外國人在我國取得或設定土地權利互惠國家一覽表List of Countries with Reciprocal Rights for Foreigners to Acquire or Set up Land Rights in Our Country</h2>

            <p>點擊地圖上的國家查看資訊</p>
                <p>本圖為手繪示意圖，國界與比例僅供概念參考，不具任何現實地緣政治或法律效力。</p>

            <div class="search-box">

                <input
                    id="countrySearch"
                    type="search"
                    autocomplete="off"
                    placeholder="🔍 國家名、英文、Country Codes"
                >

                <div id="searchResult"></div>

            </div>

        </div>

        <div class="country-card">

            <div id="countryFlag" class="flag">
                🌍
            </div>

            <h3 id="countryName">
                請選擇一個國家
            </h3>

            <div id="countryEn"></div>

            <div id="countryStatus" class="status">
                尚未選擇
            </div>

            <hr>

            <div id="countryDescription">
                點選地圖中的任一國家，即可查看土地權利互惠資訊。
            </div>

            <div class="update">
                更新日期：
                <span id="countryUpdated">—</span>
            </div>

        </div>

    </aside>

    <main id="map"></main>

</div>

</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/map.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>

</body>
